<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/d0a2940e4c.js" crossorigin="anonymous"></script>
</head>
<body class="about-page">
  <header class="about-header">
    <a class="about-home" href="index.html#home" aria-label="Home"><i class="fa-solid fa-house" aria-hidden="true"></i></a>
    <button class="about-menu-toggle" type="button" aria-expanded="false" aria-controls="about-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="about-menu" id="about-menu" aria-label="Page navigation" hidden>
      <a href="index.html#home">Home</a>
      <a href="career.html">Career paths</a>
    </nav>
  </header>

  <main class="about-main">
    <h1>ABOUT US <span aria-hidden="true">↘</span></h1>
    <section class="team-grid" aria-label="EduGuidance team">
      <article class="team-card">
        <div class="team-avatar" aria-hidden="true">AD</div>
        <h2>Atharva Deepak Jadhav</h2>
        <p class="team-course">CSE (AIML)</p>
        <p class="team-id">VU2F2526079</p>
        <a class="team-email" href="mailto:atharvadjadhav18@gmail.com">atharvadjadhav18@gmail.com</a>
      </article>
      <article class="team-card">
        <div class="team-avatar" aria-hidden="true">UK</div>
        <h2>Ujesh Upendra Kulkarni</h2>
        <p class="team-course">CSE (AIML)</p>
        <p class="team-id">VU2F2526081</p>
        <a class="team-email" href="mailto:ujeshkulkarni@gmail.com">ujeshkulkarni@gmail.com</a>
      </article>
    </section>
  </main>

  <script>
    const toggle = document.querySelector('.about-menu-toggle');
    const menu = document.querySelector('#about-menu');
    toggle.addEventListener('click', () => {
      const isOpen = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!isOpen));
      toggle.setAttribute('aria-label', isOpen ? 'Open menu' : 'Close menu');
      menu.hidden = isOpen;
    });
  </script>
</body>
</html>
