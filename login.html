<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Eduguidance</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.css" />
</head>
  <body data-scroll-container class="auth-page">
    <nav class="auth-nav">
      <div class="logo">
        <a href="index.html"><img src="Logo.png" alt="Eduguidance logo" /></a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="career.html">Career</a></li>
        <li><a href="chatbot.html">AI Chatbot</a></li>
      </ul>
      <div class="nav-actions">
        <a href="login.html" data-auth-link="login">Login</a>
        <a href="signup.html" class="signup-button" data-auth-link="signup">Sign Up</a>
        <span data-auth-user="profile" hidden></span>
        <a href="index.html" data-auth-action="logout" hidden>Logout</a>
      </div>
    </nav>

    <main class="auth-shell">
      <section class="auth-card">
        <div class="auth-copy">
          <p class="eyebrow">Welcome back</p>
          <h1>Login to your account</h1>
          <p>Continue exploring career paths, scholarships, and guidance built around your goals.</p>
        </div>

        <form id="loginForm" class="auth-form" method="post">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" maxlength="254" placeholder="you@example.com" autocomplete="email" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="6" placeholder="Enter your password" autocomplete="current-password" required />

          <button class="password-toggle" type="button" data-password-toggle="password" aria-pressed="false">Show password</button>
          <button class="auth-reset" type="button" id="resetPasswordButton">Forgot password?</button>
          <button type="submit">Login</button>
          <button id="googleSignInButton" class="auth-google" type="button">Continue with Google</button>

          <div id="authStatus" class="auth-status" aria-live="polite"></div>

          <p class="auth-switch">
            Don’t have an account?
            <a href="signup.html">Create one</a>
          </p>
        </form>
      </section>
    </main>

    <script type="module" src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.js"></script>
  <script src="locomotive-init.js"></script>
</body>
</html>
